<div class="header-text">
  @if (icon) {
    <mat-icon class="header-text__icon">
      {{icon}}
    </mat-icon>
  }

  @if (customStrIcon) {
    <span class="header-text__icon">
      {{customStrIcon}}
    </span>
  }

  <h3 class="header-text__main-text">
    {{mainText}}
  </h3>

  <span class="header-text__description">
    {{descriptionText}}
  </span>
</div>
